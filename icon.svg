<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Two Interlocking Wedding Rings -->
  <circle cx="210" cy="240" r="95" fill="none" stroke="url(#gold)" stroke-width="26" stroke-linecap="round"/>
  <circle cx="302" cy="240" r="95" fill="none" stroke="url(#rose)" stroke-width="26" stroke-linecap="round"/>
  <!-- Diamond Sparkle on Top -->
  <polygon points="210,110 225,135 210,160 195,135" fill="url(#gold)"/>
  <text x="256" y="410" font-family="-apple-system, sans-serif" font-size="52" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">啟殷 × 芷蕎</text>
  <text x="256" y="460" font-family="-apple-system, sans-serif" font-size="28" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="3">10 · 10 MC SCRIPT</text>
</svg>
